name: Lighter Testnet Auto Trade

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - tradingview_alert

jobs:
  trade:
    name: Execute Lighter Trade
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: npm install

      # ==========================================
      # 4. SHOW SIGNAL
      # ==========================================
      - name: Show TradingView Signal
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "=========================================="
          echo "       TRADINGVIEW SIGNAL RECEIVED"
          echo "=========================================="

          echo "Action:      ${{ github.event.client_payload.action }}"
          echo "Symbol:      ${{ github.event.client_payload.symbol }}"
          echo "USDT Unit:   ${{ github.event.client_payload.usdt_amount }}"
          echo "Price:       ${{ github.event.client_payload.price }}"
          echo "Reduce Only: ${{ github.event.client_payload.reduce_only }}"
          echo "Alert Name:  ${{ github.event.client_payload.alert_name }}"

          echo "=========================================="

      # ==========================================
      # 5. VALIDATE SIGNAL
      # ==========================================
      - name: Validate TradingView Signal
        if: github.event_name == 'repository_dispatch'
        env:
          TV_ACTION: ${{ github.event.client_payload.action }}
          TV_SYMBOL: ${{ github.event.client_payload.symbol }}
          TV_USDT_AMOUNT: ${{ github.event.client_payload.usdt_amount }}
          TV_PRICE: ${{ github.event.client_payload.price }}
        run: |
          echo "Checking signal..."

          if [ "$TV_ACTION" != "BUY" ] && [ "$TV_ACTION" != "SELL" ]; then
            echo "ERROR: Invalid action: $TV_ACTION"
            exit 1
          fi

          if [ "$TV_SYMBOL" != "ETHUSDT" ]; then
            echo "ERROR: Only ETHUSDT is allowed"
            exit 1
          fi

          if [ -z "$TV_USDT_AMOUNT" ]; then
            echo "ERROR: USDT amount missing"
            exit 1
          fi

          if [ -z "$TV_PRICE" ]; then
            echo "ERROR: Price missing"
            exit 1
          fi

          echo "Signal validation successful."

      # ==========================================
      # 6. EXECUTE LIGHTER TESTNET ORDER
      # ==========================================
      - name: Execute Lighter Testnet Order
        if: github.event_name == 'repository_dispatch'
        env:
          LIGHTER_NETWORK: testnet

          API_PRIVATE_KEY: ${{ secrets.LIGHTER_PRIVATE_KEY }}
          ACCOUNT_INDEX: ${{ secrets.LIGHTER_ACCOUNT_INDEX }}
          API_KEY_INDEX: ${{ secrets.LIGHTER_API_KEY_INDEX }}

          TV_ACTION: ${{ github.event.client_payload.action }}
          TV_SYMBOL: ${{ github.event.client_payload.symbol }}
          TV_USDT_AMOUNT: ${{ github.event.client_payload.usdt_amount }}
          TV_PRICE: ${{ github.event.client_payload.price }}
          TV_REDUCE_ONLY: ${{ github.event.client_payload.reduce_only }}

        run: |
          echo "=========================================="
          echo "       STARTING LIGHTER TESTNET"
          echo "=========================================="

          node trade.mjs

      # ==========================================
      # 7. FINISHED
      # ==========================================
      - name: Trade Job Finished
        if: always()
        run: |
          echo "=========================================="
          echo "          TRADE JOB FINISHED"
          echo "=========================================="
          echo "Workflow status: ${{ job.status }}"
          echo "=========================================="
