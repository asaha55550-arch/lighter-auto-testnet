name: Lighter Testnet Trade

on:
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighter SDK
        run: npm install lighter-ts-sdk

      - name: Execute Testnet Order
        env:
          LIGHTER_PRIVATE_KEY: ${{ secrets.LIGHTER_PRIVATE_KEY }}
          LIGHTER_ACCOUNT_INDEX: ${{ secrets.LIGHTER_ACCOUNT_INDEX }}
          LIGHTER_API_KEY_INDEX: ${{ secrets.LIGHTER_API_KEY_INDEX }}
        run: node trade.mjs
