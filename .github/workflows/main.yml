name: Lighter Testnet Trade

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - tradingview_alert

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Show TradingView Signal
        run: |
          echo "=== TRADINGVIEW SIGNAL RECEIVED ==="
          echo "Action: ${{ github.event.client_payload.action }}"
          echo "Symbol: ${{ github.event.client_payload.symbol }}"
          echo "Quantity: ${{ github.event.client_payload.quantity }}"
          echo "Price: ${{ github.event.client_payload.price }}"
          echo "Alert Name: ${{ github.event.client_payload.alert_name }}"
          echo "==================================="

      - name: Test Complete
        run: echo "Webhook -> GitHub connection SUCCESS"
