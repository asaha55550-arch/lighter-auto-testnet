name: Lighter Testnet Trade

on:
  workflow_dispatch:
    inputs:
      action:
        description: "buy or sell"
        required: true
        type: string
      symbol:
        description: "Trading symbol"
        required: true
        default: "ETHUSDT"
        type: string
      quantity:
        description: "ETH quantity"
        required: true
        default: "0.01"
        type: string

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighter SDK
        run: npm install lighter-ts-sdk

      - name: Execute Testnet Order
        env:
          LIGHTER_NETWORK: testnet
          API_PRIVATE_KEY: ${{ secrets.LIGHTER_PRIVATE_KEY }}
          ACCOUNT_INDEX: ${{ secrets.LIGHTER_ACCOUNT_INDEX }}
          API_KEY_INDEX: ${{ secrets.LIGHTER_API_KEY_INDEX }}
          TRADE_ACTION: ${{ inputs.action }}
          TRADE_SYMBOL: ${{ inputs.symbol }}
          TRADE_QUANTITY: ${{ inputs.quantity }}
        run: node trade.mjs
